name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        # Bun は開発ツール／パッケージ管理として使い、CI は Linux で安定させる
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # ビルド・テストを通すためだけのダミー値。実値は deploy.yml 側で渡す。
        # ここに本物のキーを書かないこと（フォークの PR でも実行されるため）
        env:
            NEXT_PUBLIC_API_URL: http://localhost:8787
            NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
            NEXT_PUBLIC_PARTYKIT_HOST: 127.0.0.1:1999
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
            NEXT_PUBLIC_EVENT_ID: 00000000-0000-4000-8000-000000000000
            VITE_API_URL: http://localhost:8787
            VITE_SUPABASE_URL: http://localhost:54321
            VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
            VITE_PARTYKIT_HOST: 127.0.0.1:1999
            VITE_EVENT_ID: 00000000-0000-4000-8000-000000000000

        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check
              run: bun run format:check

            - name: Lint / Typecheck / Test / Build
              run: bun run turbo run lint typecheck test build

    # verify とは独立して走る。E2E は verify の成果物を使わず、
    # 自分で install してビルドするため、直列にする理由がない。
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # ビルド・テストを通すためだけのダミー値。実値は deploy.yml 側で渡す。
        # ここに本物のキーを書かないこと（フォークの PR でも実行されるため）
        env:
            NEXT_PUBLIC_API_URL: http://localhost:8787
            NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
            NEXT_PUBLIC_PARTYKIT_HOST: 127.0.0.1:1999
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
            NEXT_PUBLIC_EVENT_ID: 00000000-0000-4000-8000-000000000000
            VITE_API_URL: http://localhost:8787
            VITE_SUPABASE_URL: http://localhost:54321
            VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
            VITE_PARTYKIT_HOST: 127.0.0.1:1999
            VITE_EVENT_ID: 00000000-0000-4000-8000-000000000000

        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # ブラウザ本体だけキャッシュする。OS依存パッケージ（webkit の
            # gstreamer 一式）はキャッシュに載らないので毎回入れる。
            - name: Resolve Playwright version
              id: playwright-version
              run: |
                  version=$(bunx playwright --version | awk '{print $2}')
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright system dependencies
              run: bunx playwright install-deps chromium webkit

            - name: Install Playwright browsers
              run: bunx playwright install chromium webkit

            - name: Run E2E
              run: bun run turbo run e2e

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: apps/*/playwright-report/
                  retention-days: 7
